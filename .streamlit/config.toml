# Só modo claro, como o tbbrasil: abre claro mesmo com o sistema escuro.
[theme]
base = "light"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F6F8"
textColor = "#0B1220"
primaryColor = "#C1440A"

[server]
headless = true

[client]
# Sem o botão "Deploy" nem o menu de desenvolvedor na tela pública.
toolbarMode = "minimal"
